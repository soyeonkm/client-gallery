<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for watermark text: only the bundled fonts in this folder.
     Without a config file fontconfig can't register font files at all (Vercel has none). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
